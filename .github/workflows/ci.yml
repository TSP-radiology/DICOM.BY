name: Trust-Hub Verification (Public)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-trust-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no proprietary source files leaked
        run: |
          set -e
          BAD=$(find . -not -path './.git/*' \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' -o -name '*.rc' -o -name '*.onnx' -o -name '*.pem' -o -name '*.key' -o -name '*.dpapi' -o -name '*.pfx' -o -name '*.lic' -o -name '*.dcm' -o -name 'CMakeLists.txt' \))
          if [ -n "$BAD" ]; then
            echo "Forbidden proprietary files found:"
            echo "$BAD"
            exit 1
          fi

      - name: Setup Python and install cryptography
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography dependency
        run: pip install cryptography

      - name: Run standalone verifier tests and check signed Evidence Registry
        run: |
          python verify/test_verify.py
          python verify/dicom_by_verify.py --evidence RELEASE_MANIFEST.json --admission standard/admission_v5.json
