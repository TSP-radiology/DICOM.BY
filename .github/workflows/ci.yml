name: Trust-Hub & External Windows Clinical Reproduction

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-trust-hub:
    name: Open Verifier, Guard & Signed Evidence (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no proprietary source files or unauthorized DICOM/keys leaked
        run: |
          set -euo pipefail
          BAD=$(find . -not -path './.git/*' \( \
            -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' -o -name '*.rc' \
            -o -name '*.onnx' -o -name '*.pem' -o -name '*.dpapi' -o -name '*.pfx' -o -name '*.lic' \
            -o -name 'CMakeLists.txt' \
            -o \( -name '*.dcm' -not -path './samples/verify-*/in_*.dcm' -not -path './samples/verify-*/out_*.dcm' \) \
            -o \( -name '*.key' -not -path './samples/verify-*/demo_test_only.key' \) \
          \))
          if [ -n "$BAD" ]; then
            echo "Forbidden proprietary or unauthorized files found:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: narrow sample allowlist verified; zero proprietary or unauthorized files."

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install cryptography

      - name: Run standalone MIT verifier unit+sabotage tests & verify signed release bundle
        run: |
          python verify/test_verify.py
          python verify/dicom_by_verify.py --evidence RELEASE_MANIFEST.json --admission standard/admission_v7.json --policies-dir standard --docs-dir docs --sbom SBOM.cdx.json
          python verify/dicom_by_verify.py --cert samples/verify-0.9.4/out_ct_vision.dcm.deid.json --input samples/verify-0.9.4/in_ct_vision.dcm --admission standard/admission_v7.json --key-file samples/verify-0.9.4/demo_test_only.key
          python verify/dicom_by_verify.py --cert samples/verify-0.9.4/out_ct_rle_lossless.dcm.deid.json --input samples/verify-0.9.4/in_ct_rle_lossless.dcm --admission standard/admission_v7.json --key-file samples/verify-0.9.4/demo_test_only.key
          python verify/dicom_by_verify.py --cert samples/verify-0.9.4/out_sr_ner.dcm.deid.json --input samples/verify-0.9.4/in_sr_ner.dcm --admission standard/admission_v7.json --key-file samples/verify-0.9.4/demo_test_only.key
          python verify/dicom_by_verify.py --cert samples/verify-0.9.4/bad_mlut.dcm.refused.json --key-file samples/verify-0.9.4/demo_test_only.key --expect-refused
          python verify/dicom_by_verify.py --audit samples/verify-0.9.4/gateway_audit.jsonl --key-file samples/verify-0.9.4/demo_test_only.key --evidence RELEASE_MANIFEST.json

  windows-clinical-reproduction:
    name: Dynamic Windows Engine & NCI TCIA 237 Reproduction (windows-latest)
    runs-on: windows-latest
    needs: verify-trust-hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: pip install cryptography pydicom numpy pillow

      - name: Verify Ed25519 manifest, download & SHA-256 verify installer, and install silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python verify/dicom_by_verify.py --evidence RELEASE_MANIFEST.json --admission standard/admission_v7.json --policies-dir standard --docs-dir docs --sbom SBOM.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_MANIFEST Ed25519 check failed" }

          $man = Get-Content RELEASE_MANIFEST.json -Raw -Encoding utf8 | ConvertFrom-Json
          $url = $man.editions.desktop_community.download_url
          $wantSha = $man.editions.desktop_community.installer_sha256.ToLower()
          $wantSize = [int64]$man.editions.desktop_community.installer_size
          $setupFile = Join-Path $env:RUNNER_TEMP $man.editions.desktop_community.installer_file

          Write-Host "Downloading $url ..."
          curl.exe -fSL --retry 4 --retry-delay 3 -o $setupFile $url
          $gotSize = (Get-Item $setupFile).Length
          $gotSha = (Get-FileHash $setupFile -Algorithm SHA256).Hash.ToLower()
          if ($gotSize -ne $wantSize -or $gotSha -ne $wantSha) {
            throw "Installer verification failed before execution: size=$gotSize/$wantSize sha=$gotSha/$wantSha"
          }
          Write-Host "Verified installer SHA-256 ($gotSha) BEFORE execution."

          $installDir = Join-Path $env:RUNNER_TEMP 'dicom-by-installed'
          $p = Start-Process -FilePath $setupFile -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TYPE=full', "/DIR=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installer exited with code $($p.ExitCode)" }
          & (Join-Path $installDir 'dicom-anon.exe') --version

      - name: Cache verified NCI TCIA 237 input cohort across CI runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tcia_237_in
          key: tcia-237-v1-${{ hashFiles('benchmarks/tcia_cohort_237_manifest.json') }}

      - name: Fetch 237 clinical DICOMs from public NCI TCIA NBIA API & verify input SHA-256s
        shell: pwsh
        run: |
          $tciaDir = Join-Path $env:RUNNER_TEMP 'tcia_237_in'
          python benchmarks/fetch_tcia_cohort_237.py --manifest benchmarks/tcia_cohort_237_manifest.json --out-dir $tciaDir --workers 2

      - name: Execute 13-case Matrix 0.9.4 + 237-object TCIA clinical run + 216/216 PHI remanence audit
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'dicom-by-installed'
          $tciaDir = Join-Path $env:RUNNER_TEMP 'tcia_237_in'
          $outReports = Join-Path $env:RUNNER_TEMP 'repro_reports_094'
          $certsTar = Join-Path $outReports 'tcia-certs-gha-0.9.4.tar.gz'
          python benchmarks/run_clinical_and_matrix_093.py `
            --bin-dir $installDir `
            --verifier verify/dicom_by_verify.py `
            --tcia-dir $tciaDir `
            --manifest benchmarks/tcia_cohort_237_manifest.json `
            --out-reports $outReports `
            --export-certs-tar $certsTar `
            --mode all

      - name: Upload independent GitHub Actions Windows reproduction reports & 237 certificates
        uses: actions/upload-artifact@v4
        with:
          name: dicom-by-0.9.4-windows-tcia237-reproduction
          path: ${{ runner.temp }}/repro_reports_094/*
          retention-days: 90
